*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;position:sticky;top:0;z-index:5}

.seg{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--mut)}
.seg button{font:inherit;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#14213d;font-weight:700}
.nota{color:var(--gold)}
main{padding:12px 16px;max-width:720px;margin:auto}
.cnt{font-size:13px;color:var(--mut);margin:4px 2px 10px}
.it{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:11px 14px;margin-bottom:8px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.it.panteon{border-left-color:var(--gold)}
.it b{font-weight:600}.it small{display:block;color:var(--mut)}
.n{font-weight:700;color:var(--blue);white-space:nowrap;text-align:right}
.panteon .n{color:var(--gold)}
.tipo{font-size:12px;font-weight:600}
mark{background:#6b5410;color:#fff;border-radius:3px}
.more{display:block;margin:12px auto;padding:10px 18px;border:0;border-radius:10px;background:var(--btn);color:#fff;font:inherit}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:0;width:min(92vw,440px);box-shadow:0 20px 50px rgba(20,33,61,.35)}
dialog::backdrop{background:rgba(20,33,61,.55)}
.dh{background:var(--hd);color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:center}
.dh img{width:40px;height:40px;border-radius:8px;background:#fff;padding:3px}.dh h2{margin:0;font-size:17px}
.db{padding:6px 18px 16px}
.f{padding:10px 0;border-bottom:1px solid var(--line)}.f span{display:block;font-size:13px;color:var(--mut)}
.o{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
h3{font-size:14px;margin:14px 0 2px;color:var(--mut);font-weight:600}
.x{margin:12px 18px 18px;width:calc(100% - 36px);padding:12px;border:0;border-radius:10px;background:var(--line);color:#fff;font:inherit}
</style>

const N=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const I=D.map((r,i)=>({i,k:N(r[0]),casa:N(r[1])}));

// Agrupa los registros del mismo titular. Se usa NIF cuando existe y,
// si no, el nombre, para no perder relaciones del padrón.
const G={};
D.forEach((r,i)=>{
  const key=r[5]||N(r[0]);
  (G[key]??=[]).push(i);
});

const q=document.getElementById('q'),l=document.getElementById('l'),c=document.getElementById('c'),d=document.getElementById('d');
let res=[],shown=0,toks=[],mode='';
const P=60;

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function hl(s){
  let t=esc(s);
  if(!toks.length)return t;
  const n=N(s),m=new Array(s.length).fill(0);
  toks.forEach(k=>{
    let p=n.indexOf(k);
    while(p>-1){
      for(let j=p;j<p+k.length&&j<s.length;j++)m[j]=1;
      p=n.indexOf(k,p+1);
    }
  });
  let o='',on=0;
  for(let j=0;j<s.length;j++){
    if(m[j]&&!on){o+='<mark>';on=1}
    if(!m[j]&&on){o+='</mark>';on=0}
    o+=esc(s[j]);
  }
  return o+(on?'</mark>':'');
}

function tipo(r){
  if(r[4]===70)return 'Panteón';
  if(r[4]===19)return 'Primera';
  return 'Segunda';
}

function row(i){
  const r=D[i],pan=r[4]===70;
  return `<button class="it ${pan?'panteon':''}" onclick="show(${i})">
    <span><b>${hl(r[0])}</b><small>${tipo(r)} · Casa ${esc(r[1])}</small></span>
    <span class="n">${pan?'Panteón':'Nicho'} ${r[2]}</span>
  </button>`;
}

// Orden por nombre: alfabético.
// Orden por número: primero Primera (19 €), después Segunda (10 €),
// y por último Panteones (70 €). Dentro de cada grupo manda CASA/NÚMERO,
// nunca el número de recibo.
const NAMEORD=D.map((_,i)=>i).sort((a,b)=>N(D[a][0]).localeCompare(N(D[b][0]),'es')||D[a][2]-D[b][2]||D[a][3]-D[b][3]);
const groupRank={19:0,10:1,70:2};
const NUMORD=D.map((_,i)=>i).sort((a,b)=>
  (groupRank[D[a][4]]??9)-(groupRank[D[b][4]]??9) ||
  D[a][2]-D[b][2] ||
  N(D[a][1]).localeCompare(N(D[b][1]),'es') ||
  N(D[a][0]).localeCompare(N(D[b][0]),'es')
);
const ORD=[NAMEORD,NUMORD];

let sort=0;

function setSort(s){
  sort=s;
  document.getElementById('s0').classList.toggle('on',!s);
  document.getElementById('s1').classList.toggle('on',!!s);
  run();
}

function run(){
  let s=N(q.value).trim(),nums=[];
  mode='';

  // "panteón 5" busca únicamente los registros con tasa 70.
  // "nicho 123" busca únicamente los de 19 € o 10 €.
  const pm=s.match(/\b(?:panteon|panteones|panteó|panteón)\s*[º°#]?\s*(\d+)\b/);
  const nm=s.match(/\b(?:nicho|nichos|ninxol|ninxols)\s*[º°#]?\s*(\d+)\b/);

  if(pm){
    nums=[+pm[1]];
    mode='panteon';
    s=s.replace(pm[0],' ');
  }else if(nm){
    nums=[+nm[1]];
    mode='nicho';
    s=s.replace(nm[0],' ');
  }else{
    // Un número solo busca tanto nichos como panteones.
    s=s.replace(/\b\d+\b/g,m=>{nums.push(+m);return' '});
  }

  // Permite también escribir solo "panteón" o "nicho" para filtrar por tipo.
  if(/\b(?:panteon|panteones|panteó|panteón)\b/.test(s))mode='panteon';
  if(/\b(?:nicho|nichos|ninxol|ninxols)\b/.test(s))mode='nicho';

  s=s.replace(/\b(?:panteon|panteones|panteó|panteón|nicho|nichos|ninxol|ninxols)\b/g,' ');
  toks=s.split(/\s+/).filter(Boolean);

  res=ORD[sort].filter(i=>{
    const r=D[i];
    const tipoOK=mode==='panteon' ? r[4]===70 : mode==='nicho' ? r[4]!==70 : true;
    const numOK=!nums.length || nums.includes(r[2]);
    const textOK=toks.every(t=>I[i].k.includes(t)||I[i].casa.includes(t));
    return tipoOK&&numOK&&textOK;
  });

  shown=0;l.innerHTML='';more();

  const f=toks.length||nums.length||mode;
  let label='';
  if(mode==='panteon')label=' · Panteones';
  else if(mode==='nicho')label=' · Nichos';
  c.innerHTML=(f?(res.length?res.length+(res.length===1?' resultado':' resultados'):'Sin resultados'):(D.length+' registros'))+label;

  if(!res.length)l.innerHTML='<div class="empty">No hay resultados. Prueba con un apellido, un número, «nicho 123» o «panteón 5».</div>';
}

function more(){
  const b=l.querySelector('.more');if(b)b.remove();
  l.insertAdjacentHTML('beforeend',res.slice(shown,shown+P).map(row).join(''));
  shown+=P;
  if(shown<res.length)l.insertAdjacentHTML('beforeend',`<button class="more" onclick="more()">Mostrar más (${res.length-shown})</button>`);
}

function show(i){
  const r=D[i],pan=r[4]===70;
  document.getElementById('dn').textContent=r[0];
  const key=r[5]||N(r[0]);
  let h=`
    <div class="f"><span>Tipo</span><b>${tipo(r)}</b></div>
    <div class="f"><span>${pan?'Panteón':'Nicho'}</span><b>${r[2]}</b></div>
    <div class="f"><span>Casa</span>${esc(r[1])}</div>
    <div class="f"><span>Núm. recibo</span>${r[3]}</div>
    <div class="f"><span>Importe tasa</span>${r[4]} €</div>
  `;
  const o=(G[key]||[]).filter(j=>j!==i);
  if(o.length){
    h+='<h3>Otros registros del mismo titular</h3>'+
      o.map(j=>`<div class="o">${D[j][4]===70?'Panteón':'Nicho'} <b>${D[j][2]}</b> · ${D[j][4]===70?'Panteón':'Casa'} ${esc(D[j][1])} · ${tipo(D[j])}</div>`).join('');
  }
  document.getElementById('db').innerHTML=h;
  d.showModal();
}
